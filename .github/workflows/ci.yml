# Tier 1 runs on a push to main only: the lander already ran it locally on the exact combination, so this is the independent check that defines "main is red".
# Hosted runners only (this repository is public: never self-hosted), a read-only token, no secret, no pull_request trigger (hosted minutes are budgeted).
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tier 1
        run: tests/run.sh
  # The Lean leg: the tests that need a Lean toolchain (the axiom gate with a real library) and the shared attacks that need lake. Hosted runner, read-only token. The toolchain is the release tarball of the
  # version in LEAN_VERSION, checked against its published sha256 before it is unpacked (nothing is piped into a shell).
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_VERSION: 4.35.0
      LEAN_SHA256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Lean toolchain
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lean.tar.zst" "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          echo "${LEAN_SHA256}  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/lean" && tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$HOME/lean" --strip-components=1
          echo "$HOME/lean/bin" >> "$GITHUB_PATH"
      - name: The Lean leg
        run: tests/run-lean.sh
