# scripts/gates.conf: this repository's gate tables (data; GATES_KEY=value, an unknown key fails: KEYS). The package's own gates judge the package's own gate sources.
# The Tier 1 script: may only GAIN lines; a removed or changed line needs an exact-diff approval the judge recomputes.
GATES_TIER1=tests/run.sh
GATES_APPROVABLE=tests/run.sh
# Lists that only grow, and the gate sources (a change is judged by the relabel-attack suite). A test script is not in the judged set; the protected list and the lander's approvals are.
GATES_LISTS=scripts/protected-paths.txt scripts/gate-edit-approvals.txt
GATES_SOURCE=KEYS VERSION tests/lint.sh tests/lib.sh scripts/land-direct scripts/land.conf scripts/land.signers scripts/gates.conf
GATES_SOURCE_DIRS=core/ hooks/ lean/ attacks/ bin/ scripts/land/ scripts/land.d/
GATES_PROTECTED_LIST=scripts/protected-paths.txt
