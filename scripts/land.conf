# scripts/land.conf: this repository's landing configuration. Data, not code: LAND_KEY=value per line, no expansion, unknown keys are errors.
# Every key and its default: the README of the pinned lander (vbm-land). Read from origin/<base>, so a change cannot loosen the rules it is judged by.
LAND_BASE=main

# Tier 1 (the gate): the lints, the vendored lander's drift check, then every hermetic test (tests/run.sh).
LAND_TEST_CMD=tests/run.sh

# Size budget: the gate code itself (documents and vendored copies are not production lines). Conventional Commits.
LAND_PROD_PATHS=core hooks lean attacks bin tests
LAND_BUDGET_LINES=150
LAND_CONVENTIONAL=1

# The gate-defining set: a change that touches it never counts as a fix for a red main.
LAND_PROTECTED=scripts/land.conf scripts/land.d/* scripts/land/* scripts/land-direct scripts/land.signers
LAND_FIX_PATHS=tests/* .github/*

# The structural protected set: a landing that touches a path of this list needs a one-time approval of its exact net diff already on main (scripts/gate-edit-approvals.txt).
LAND_PROTECTED_LIST=scripts/protected-paths.txt
LAND_APPROVALS=scripts/gate-edit-approvals.txt
LAND_APPROVAL_DAYS=7
