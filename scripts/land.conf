# scripts/land.conf: this repository's landing configuration (vbm-land). Data, not code.
LAND_BASE=main
LAND_TEST_CMD=tests/run.sh
LAND_BUDGET_LINES=0
LAND_CONVENTIONAL=1
# The lander's own files and the signing keys are the only protected paths (the drift check guards the vendored copy).
LAND_FIX_PATHS=tests/* .github/*
LAND_GENERATED_LIST=scripts/generated.txt
LAND_REGEN_CMD=bin/gates-manifest
LAND_GEN_CMD=bin/gates-manifest
